services:
  llm-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-router-app-1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - cfo_autopilot_default
      - llm_router_internal
    depends_on:
      llm-router-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # порт наружу НЕ публикуем (только expose) — сервис доступен исключительно из docker-сети

  llm-router-db:
    image: postgres:16-alpine
    container_name: llm-router-db-1
    environment:
      POSTGRES_DB: llm_router
      POSTGRES_USER: llm_router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - llm_router_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - llm_router_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_router -d llm_router"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # порты НЕ публикуем и НЕ подключаем к cfo_autopilot_default — доступ только из llm-router app

networks:
  cfo_autopilot_default:
    external: true
  llm_router_internal:
    internal: true

volumes:
  llm_router_pgdata:
